/* 上面这个字体只打包了「知时 KAIROS」八个字形（1.7KB），改动字标文案需重新子集化 */
:root{
  /* 主色阶取自 TR 标识 #7698A6 */
  --ink-50:#EEF4F7;--ink-100:#DCE9EF;--ink-200:#B9D1DC;--ink-300:#8FB0BF;
  --ink-400:#5F8C9F;--ink-500:#7698A6;--ink-600:#3A6175;--ink-800:#254555;--ink-900:#17303D;
  --paper-0:#FFFFFF;--paper-50:#FBFBF9;--paper-100:#F3F4F1;
  --paper-200:#E4E6E1;--paper-400:#C9CCC4;
  --clay-50:#FAF3ED;--clay-100:#F1E2D4;--clay-400:#C09272;
  --clay-600:#9E6D48;--clay-800:#6F4A2C;
  --n-0:#FFFFFF;--n-100:#F0F1EE;--n-200:#E1E3DE;--n-400:#A3A8A4;
  --n-600:#697070;--n-800:#2B3134;--n-900:#141A1D;
  --dom-s:#3A6175;--dom-e:#748F80;--dom-r:#A97B58;--dom-i:#7F87A3;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;
  --s-6:24px;--s-8:32px;--s-10:40px;--s-14:56px;--s-18:72px;
  --r-sm:8px;--r-md:10px;--r-lg:18px;--r-xl:26px;--r-full:999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --font-num:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  /* 品牌字标：宋体（有笔锋、耐看，与大标题的无衬线正文形成对比） */
  --font-brand:"KairosSerif","Noto Serif SC","Songti SC","Source Han Serif SC","STSong","SimSun",serif;
  --t-fast:120ms;--t-base:220ms;--t-slow:280ms;
  --ease:cubic-bezier(0.2,0,0,1);
  /* 新野兽派：硬描边 / 硬阴影 */
  --nb-ink:#15262E;--nb-shadow:4px 4px 0 var(--nb-ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-100);color:var(--n-800);
  font-family:var(--font-sans);font-size:15px;line-height:1.8;
  letter-spacing:.01em;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-appearance:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink-400);outline-offset:3px}
#app{min-height:100vh;min-height:100dvh}
.pad{padding-left:22px;padding-right:22px}

/* ---------- 通用 ---------- */
.btn-primary{
  display:block;width:100%;height:50px;border-radius:var(--r-md);
  background:var(--ink-600);color:#fff;font-size:15px;font-weight:500;
  letter-spacing:.1em;
  transition:background var(--t-fast) ease-out,transform var(--t-fast) ease-out;
}
.btn-primary:hover{background:var(--ink-800)}
.btn-primary:active{transform:scale(.985)}
.btn-primary[disabled]{background:var(--n-200);color:var(--n-400);cursor:not-allowed;transform:none}
.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:var(--r-md);
  border:1px solid var(--paper-400);color:var(--ink-600);font-size:14px;
  letter-spacing:.06em;background:transparent;
  transition:background var(--t-fast) ease-out,border-color var(--t-fast) ease-out;
}
.btn-ghost:hover{background:var(--paper-0);border-color:var(--ink-300)}
.btn-text{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 12px;color:var(--n-600);font-size:13px;letter-spacing:.04em;
}
.btn-text:hover{color:var(--n-900);text-decoration:underline;text-underline-offset:4px}
.micro{font-size:11px;line-height:1.7;color:var(--n-400);text-align:center}
.cap{font-size:13px;line-height:1.7;color:var(--n-600)}
.fade-in{animation:fadeIn var(--t-base) var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- 品牌 ---------- */
.brand{width:76px;height:auto;margin:0 auto;opacity:.95}
.brand-sm{width:30px;height:auto;flex:none}

/* 字标：知时 KAIROS —— 同一字体族、同一颜色、光学等大 */
.wm{
  display:inline-block;font-family:var(--font-brand);font-weight:400;
  color:var(--ink-900);letter-spacing:.14em;line-height:1.1;
  white-space:nowrap;margin-right:-.14em;
}
.wm i{
  display:inline-block;font-family:inherit;font-style:normal;font-weight:400;
  /* 汉字墨迹约占 0.86em，拉丁大写只占 0.71em —— 用 1.2 倍字号才能与汉字视觉等高 */
  font-size:1.2em;letter-spacing:.2em;margin-left:.26em;
  /* 汉字底部略低于基线，拉丁下沉 0.11em 让两者的下沿对齐 */
  transform:translateY(.11em);
}

/* ---------- 开场 ---------- */
.intro{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
  padding:max(64px,calc(env(safe-area-inset-top) + 44px)) 24px
          max(28px,env(safe-area-inset-bottom));
}
.intro-top{text-align:center;margin-top:auto}
.intro .brand{margin-bottom:28px}
.intro h1{font-size:30px;font-weight:400;line-height:1.5;text-align:center}
.lead{font-size:16px;line-height:1.95;color:var(--n-600);text-align:center;max-width:290px;margin:26px auto 0;letter-spacing:.04em}
.dashed{border:0;border-top:2px solid var(--nb-ink);width:40px;margin:40px auto 38px;opacity:.85}

/* 新野兽派信息块：粗描边 + 硬阴影 + 微旋转 */
.nb-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
  padding:0 1px 5px;
}
.nb-chip{
  position:relative;text-align:center;
  border:2px solid var(--nb-ink);box-shadow:var(--nb-shadow);
  padding:20px 5px 17px;background:var(--paper-0);color:var(--nb-ink);
  transform:rotate(-.85deg);
  transition:transform var(--t-base) var(--ease);
}
.nb-chip:nth-child(2){transform:rotate(.7deg)}
.nb-chip:nth-child(3){transform:rotate(-.45deg)}
.nb-chip .num{
  display:block;font-family:var(--font-num);
  font-size:29px;font-weight:800;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.nb-chip .lb{
  display:block;margin-top:10px;
  font-size:11px;font-weight:600;line-height:1.4;
  letter-spacing:.09em;opacity:.85;
}
.nb-chip.is-ink{background:var(--ink-500);color:#fff}
.nb-chip.is-clay{background:var(--clay-100)}
.nb-chip.is-paper{background:var(--paper-0)}
.intro-actions{margin-top:32px;display:flex;flex-direction:column;gap:8px}
/* 野兽派主按钮：方角、硬描边、按下位移 */
.btn-primary.nb{
  height:54px;border-radius:0;
  border:2px solid var(--nb-ink);box-shadow:5px 5px 0 var(--nb-ink);
  background:var(--ink-600);font-weight:700;letter-spacing:.18em;text-indent:.18em;
  transition:transform var(--t-fast) ease-out,box-shadow var(--t-fast) ease-out,
             background var(--t-fast) ease-out;
}
.btn-primary.nb:hover{background:var(--ink-800)}
.btn-primary.nb:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--nb-ink)}
.intro-note{font-size:11px;line-height:1.7;color:var(--n-400);text-align:center;margin-top:22px}
.resume-box{
  background:var(--paper-0);border:2px solid var(--nb-ink);
  box-shadow:var(--nb-shadow);padding:24px 20px;margin-top:32px;
}
.resume-box p{font-size:15px;color:var(--n-900);font-weight:500;letter-spacing:.02em}
.resume-box .cap{margin-top:8px}
.resume-box .row{display:flex;gap:10px;margin-top:22px;align-items:center}
.resume-box .btn-primary,.resume-box .btn-ghost{border-radius:0}
.resume-box .btn-primary{font-weight:700;letter-spacing:.14em}
.resume-box .btn-ghost{border:2px solid var(--nb-ink);color:var(--nb-ink);font-weight:500}
.resume-box .row .btn-primary{flex:1}
.intro-foot{margin-top:auto;padding-top:32px;text-align:center}
.intro-foot p{font-size:11px;line-height:1.7;color:var(--n-400);letter-spacing:.02em}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;
  background:var(--paper-0);border-top:2px solid var(--nb-ink);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  height:62px;font-size:11px;letter-spacing:.14em;
  color:var(--n-400);transition:color var(--t-fast) ease-out;
}
.tabbar button:hover{color:var(--n-600)}
.tabbar button.on{color:var(--ink-800);font-weight:700}
.tabbar button.on::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;background:var(--nb-ink);
}
.tabbar .ico{width:19px;height:19px;display:block}
/* 品牌位：仅桌面端顶部导航显示 */
.tabbar .tb-brand{display:none}

/* 顶部返回（流程页） */
.nav-back{
  display:inline-flex;align-items:center;gap:4px;
  min-height:30px;padding:0 8px 0 4px;margin-left:-4px;
  font-size:12px;letter-spacing:.1em;color:var(--n-600);
  transition:color var(--t-fast) ease-out;
}
.nav-back:hover{color:var(--n-900)}
.nav-back .ar{font-size:14px;line-height:1;margin-top:-1px}
.rescue .nav-back{margin-bottom:6px}

/* ---------- 我的 ---------- */
.mine{
  min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:max(52px,calc(env(safe-area-inset-top) + 32px)) 24px 108px;
}
.mine-hd{display:flex;align-items:center;gap:11px;padding-bottom:18px;
  border-bottom:1px solid var(--paper-200)}
.mine-hd .brand-xs{width:34px;height:auto;opacity:.9;flex:none}
.mine-hd h1{font-size:17px;font-weight:500;color:var(--n-900);letter-spacing:.16em}
.mine-hd .hd-d{font-size:11px;color:var(--n-400);letter-spacing:.06em;margin-left:auto}

.mine-sec{margin-top:34px}
.mine-lb{font-size:10px;font-weight:600;color:var(--n-400);
  letter-spacing:.2em;margin-bottom:14px}

/* 记忆开关 */
.memrow{
  display:flex;align-items:center;gap:14px;
  background:var(--paper-0);border:2px solid var(--nb-ink);
  box-shadow:var(--nb-shadow);padding:18px 18px;
}
.memrow .mt{flex:1;min-width:0}
.memrow .mt b{display:block;font-size:14px;font-weight:600;color:var(--n-900);letter-spacing:.02em}
.memrow .mt span{display:block;font-size:11px;line-height:1.7;color:var(--n-600);margin-top:4px}
.switch{
  position:relative;flex:none;width:52px;height:30px;
  border:2px solid var(--nb-ink);background:var(--paper-200);
  box-shadow:3px 3px 0 var(--nb-ink);
  transition:background var(--t-base) var(--ease);
}
.switch i{
  position:absolute;top:2px;left:2px;width:22px;height:22px;
  background:var(--n-600);
  transition:transform var(--t-base) var(--ease),background var(--t-base) var(--ease);
}
.switch.on{background:var(--ink-500)}
.switch.on i{transform:translateX(22px);background:var(--paper-0)}

/* 记录卡 */
.rec{
  position:relative;
  display:block;width:100%;text-align:left;
  background:var(--paper-0);border:2px solid var(--nb-ink);
  box-shadow:var(--nb-shadow);padding:15px 17px;margin-bottom:14px;
  transition:transform var(--t-fast) ease-out,box-shadow var(--t-fast) ease-out;
}
.rec:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--nb-ink)}
.rec .d{display:block;font-size:10px;color:var(--n-400);letter-spacing:.14em;
  padding-right:56px;font-variant-numeric:tabular-nums}
.rec .n{display:block;font-size:16px;font-weight:700;color:var(--n-900);
  letter-spacing:.04em;margin-top:6px}
.rec .t{display:block;font-size:11px;line-height:1.75;color:var(--n-600);
  margin-top:5px;letter-spacing:.03em}
.rec .go{position:absolute;right:16px;top:16px;font-size:11px;color:var(--ink-600);font-weight:600}

.mine-empty{
  border:1px dashed var(--paper-400);padding:30px 20px;text-align:center;
}
.mine-empty p{font-size:13px;color:var(--n-400);line-height:1.9}
.mine-empty .btn-ghost{margin-top:16px;border-radius:0;border:2px solid var(--nb-ink);
  color:var(--nb-ink);font-weight:500}

.danger{
  width:100%;min-height:48px;margin-top:30px;
  border:2px dashed var(--clay-600);background:transparent;
  color:var(--clay-600);font-size:13px;letter-spacing:.1em;
  transition:background var(--t-fast) ease-out;
}
.danger:hover{background:var(--clay-50)}
.danger[disabled]{border-color:var(--paper-400);color:var(--n-400);cursor:not-allowed}

/* 主页「最近一次」 */
.last-rec{
  display:flex;align-items:center;gap:10px;width:100%;
  margin-top:24px;padding:13px 15px;text-align:left;
  border:1px dashed var(--paper-400);background:var(--paper-0);
  transition:border-color var(--t-fast) ease-out;
}
.last-rec:hover{border-color:var(--ink-300)}
.last-rec .lr-t{flex:none;font-size:10px;letter-spacing:.14em;color:var(--n-400)}
.last-rec .lr-n{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-800);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last-rec .lr-g{flex:none;font-size:11px;color:var(--n-600)}
.intro.has-tab{padding-bottom:108px}

/* ---------- 聚光灯引导 ---------- */
body.spot-open{overflow:hidden}
.spot{position:fixed;inset:0;z-index:72}
.spot-hole{
  position:fixed;left:0;top:0;width:0;height:0;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 9999px rgba(13,19,23,.85);
  transition:left .3s var(--ease),top .3s var(--ease),
             width .3s var(--ease),height .3s var(--ease);
  pointer-events:none;
}
.spot-tip{
  position:fixed;left:24px;right:24px;
  background:var(--paper-0);border:2px solid var(--nb-ink);
  box-shadow:6px 6px 0 var(--nb-ink);
  padding:19px 20px 15px;
  transform:rotate(-.55deg);
}
.spot-tip.in{animation:fadeUp .26s var(--ease) both}
.spot-tip .sno{
  font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--clay-600);
  font-variant-numeric:tabular-nums;
}
.spot-tip h3{
  font-size:17px;font-weight:700;line-height:1.5;
  color:var(--n-900);letter-spacing:.06em;margin-top:7px;
}
.spot-tip p{
  font-size:13px;line-height:1.85;color:var(--n-600);
  margin-top:8px;letter-spacing:.02em;
}
.spot-tip .sacts{display:flex;align-items:center;gap:8px;margin-top:15px}
.spot-tip .skip{
  font-size:12px;color:var(--n-400);letter-spacing:.08em;padding:8px 2px;
  transition:color var(--t-fast) ease-out;
}
.spot-tip .skip:hover{color:var(--n-800)}
.spot-dots{display:flex;gap:6px;margin-left:4px}
.spot-dots i{display:block;width:6px;height:6px;background:var(--paper-400)}
.spot-dots i.on{background:var(--nb-ink)}
.spot-tip .next{
  margin-left:auto;height:42px;padding:0 22px;
  background:var(--ink-600);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.14em;text-indent:.14em;
  border:2px solid var(--nb-ink);box-shadow:3px 3px 0 var(--nb-ink);
  transition:transform var(--t-fast) ease-out,box-shadow var(--t-fast) ease-out,
             background var(--t-fast) ease-out;
}
.spot-tip .next:hover{background:var(--ink-800)}
.spot-tip .next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--nb-ink)}

/* 我的页：重看介绍 */
.linkline{
  display:block;width:100%;margin-top:24px;padding:15px 0;
  font-size:12px;color:var(--ink-600);letter-spacing:.12em;
  border-top:1px solid var(--paper-200);text-align:left;
  transition:color var(--t-fast) ease-out;
}
.linkline:hover{color:var(--ink-800)}

/* ---------- 对决 ---------- */
.duel{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  max-width:720px;margin:0 auto;overflow:hidden;
  padding:max(22px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
}
.progbar{height:8px;border-radius:4px;background:var(--paper-200);overflow:hidden;flex:none;margin-top:14px}
.progbar i{display:block;height:100%;background:var(--ink-500);width:0;transition:width 260ms var(--ease)}
.count{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;margin-top:11px;flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:.16em;
  color:var(--n-600);
}
.count .rnd{color:var(--ink-600);font-weight:600;letter-spacing:.1em;margin-left:auto}
.count .idx{color:var(--n-600);letter-spacing:.12em;margin-left:10px}
.count .nav-back{min-height:30px;font-size:11px;letter-spacing:.08em;color:var(--n-600)}
.duel-body{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:stretch;min-height:0;padding:14px 0;
}
.duel-hint{
  font-size:12px;color:var(--n-600);text-align:center;
  letter-spacing:.1em;margin-bottom:20px;flex:none;
}
.cards{display:flex;flex-direction:column;gap:0}
.card{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
  width:100%;min-height:186px;padding:30px 24px 24px;
  background:var(--paper-0);border:2px solid var(--nb-ink);
  border-radius:0;text-align:left;
  transition:background var(--t-fast) ease-out,border-color var(--t-fast) ease-out,
             opacity var(--t-fast) ease-out,transform var(--t-fast) ease-out;
}
/* 顶部域色条：给每张卡一个可见的归类锚点 */
.card::after{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:var(--ink-300);
}
.card[data-dom="S"]::after{background:var(--dom-s)}
.card[data-dom="E"]::after{background:var(--dom-e)}
.card[data-dom="R"]::after{background:var(--dom-r)}
.card[data-dom="I"]::after{background:var(--dom-i)}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:0;
  background:var(--ink-600);transition:width var(--t-fast) ease-out;
}
.card:hover{background:var(--paper-50);border-color:var(--ink-200)}
.card:hover::before{width:3px}
.card.picked{border-color:var(--ink-600);background:var(--ink-50)}
.card.picked::before{width:3px}
.card.dim{opacity:.34;transform:scale(.995)}
.card-q{display:block;font-size:17px;line-height:1.78;color:var(--n-800);letter-spacing:.01em}
.card-n{
  display:block;margin-top:18px;font-size:12px;font-weight:500;
  color:var(--ink-400);text-align:right;letter-spacing:.22em;
}
.or{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:24px 0;flex:none;
}
.or::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:0;
  border-left:1px dashed var(--paper-400);opacity:.9;
}
.or span{
  position:relative;z-index:1;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-100);border:1px solid var(--paper-400);
  font-size:11px;color:var(--n-600);letter-spacing:0;text-indent:0;
}
.duel-skip{display:flex;justify-content:center;flex:none;padding-top:6px}
.duel-skip .btn-text{
  min-height:40px;padding:0 24px;border:1px dashed var(--paper-400);
  border-radius:var(--r-full);font-size:12px;color:var(--n-600);letter-spacing:.08em;
  transition:border-color var(--t-fast) ease-out,color var(--t-fast) ease-out;
}
.duel-skip .btn-text:hover{border-color:var(--ink-400);color:var(--ink-600);text-decoration:none}

/* 定序 */
.order-head{text-align:center;flex:none;padding-top:8px}
.order-head h2{font-size:18px;font-weight:500;color:var(--n-900);letter-spacing:.08em}
.order-head p{font-size:14px;color:var(--n-600);margin-top:10px;letter-spacing:.04em}
.order-list{display:flex;flex-direction:column;gap:9px}
.order-card{
  display:flex;align-items:center;gap:13px;min-height:62px;padding:0 22px;
  background:var(--paper-0);border:1px solid var(--paper-200);border-radius:var(--r-md);
  transition:background var(--t-fast) ease-out,border-color var(--t-fast) ease-out;
}
.order-card:hover{background:var(--paper-50);border-color:var(--ink-200)}
.order-card .nm{font-size:16px;font-weight:500;color:var(--n-900);letter-spacing:.12em}
.dot{width:5px;height:5px;border-radius:50%;flex:none}
.order-card .dv{margin-left:auto;font-size:10px;color:var(--n-400);letter-spacing:.14em}

/* ---------- 过渡 ---------- */
.trans{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;
}
.trans h2{font-size:20px;font-weight:500;color:var(--n-900);letter-spacing:.14em;animation:fadeUp 400ms var(--ease) both}
.trans p{font-size:13px;color:var(--n-400);margin-top:16px;font-variant-numeric:tabular-nums;letter-spacing:.14em;animation:fadeUp 400ms 80ms var(--ease) both}

/* ---------- 捞回 ---------- */
.rescue{
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  max-width:540px;margin:0 auto;
  padding:max(56px,calc(env(safe-area-inset-top) + 40px)) 22px
          max(24px,env(safe-area-inset-bottom));
}
.rescue h2{font-size:21px;font-weight:500;color:var(--n-900);letter-spacing:.04em;flex:none}
.rescue .sub{font-size:14px;color:var(--n-600);margin-top:12px;flex:none}
.rescue-list{
  margin-top:28px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:8px;padding-bottom:4px;
}
.ritem{position:relative;overflow:hidden;
  display:flex;gap:13px;align-items:flex-start;text-align:left;
  min-height:62px;padding:14px 16px;background:var(--paper-0);
  border:1px solid var(--paper-200);border-radius:var(--r-md);
  transition:background var(--t-fast) ease-out,border-color var(--t-fast) ease-out;
}
.ritem:hover{border-color:var(--ink-200)}
.ritem.on{border-color:var(--ink-600);background:var(--ink-50)}
.ritem.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-600)}
.ritem .ring{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--paper-400);
  flex:none;margin-top:4px;position:relative;
}
.ritem.on .ring{border-color:var(--ink-600)}
.ritem.on .ring::after{
  content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink-600);
}
.ritem .txt{min-width:0}
.ritem .nm{display:block;font-size:15px;font-weight:500;color:var(--n-800);letter-spacing:.08em}
.ritem .df{display:block;font-size:13px;color:var(--n-600);margin-top:3px;line-height:1.55;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rescue-actions{margin-top:16px;padding-top:16px;display:flex;flex-direction:column;gap:4px;flex:none}
.rescue-actions .btn-primary{margin-bottom:4px}

/* ---------- 分享横幅 ---------- */
.share-banner{
  display:flex;align-items:center;gap:14px;
  background:var(--ink-50);border:1px solid var(--ink-100);
  border-radius:var(--r-lg);padding:16px 18px;margin-top:max(28px,calc(env(safe-area-inset-top) + 16px));
}
.share-banner .txt{flex:1;min-width:0}
.share-banner .t1{font-size:13px;color:var(--ink-800);line-height:1.6;font-weight:500;letter-spacing:.04em}
.share-banner .t2{font-size:11px;color:var(--ink-400);line-height:1.6;margin-top:3px}
.share-banner button{
  flex:none;height:36px;padding:0 16px;border-radius:var(--r-full);
  background:var(--ink-600);color:#fff;font-size:12px;letter-spacing:.08em;
}

/* ---------- 结果 ---------- */
.result{
  max-width:540px;margin:0 auto;position:relative;
  padding:0 22px max(32px,env(safe-area-inset-bottom));
}
.res-nav{
  position:absolute;top:max(14px,env(safe-area-inset-top));left:22px;z-index:6;
}
.hero{padding-top:max(64px,calc(env(safe-area-inset-top) + 40px));text-align:center}
.result.has-banner .hero{padding-top:34px}
.hero .brand{width:50px;margin-bottom:34px;animation:fadeIn 500ms var(--ease) both}
.arch{
  font-size:52px;font-weight:500;line-height:1.12;color:var(--n-900);
  letter-spacing:.14em;text-indent:.14em;animation:fadeUp 480ms var(--ease) both;
}
.code{
  font-size:12px;font-weight:500;color:var(--clay-600);
  letter-spacing:.28em;text-indent:.28em;margin-top:16px;
  animation:fadeUp 480ms 60ms var(--ease) both;
}
.hero-rule{width:34px;height:1px;background:var(--ink-300);margin:24px auto 0;animation:fadeIn 600ms 120ms var(--ease) both}
.hero-img{font-size:15px;line-height:1.85;color:var(--n-600);max-width:310px;margin:22px auto 0;letter-spacing:.02em;animation:fadeUp 480ms 140ms var(--ease) both}
.scroll-cue{font-size:10px;color:var(--n-400);margin-top:44px;letter-spacing:.2em;animation:fadeIn 700ms 400ms var(--ease) both}

.sec{margin-top:60px;padding-top:52px;border-top:1px solid var(--paper-200)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec-no{
  display:block;font-family:var(--font-num);font-size:10px;letter-spacing:.24em;
  color:var(--ink-300);margin-bottom:10px;
}
.sec h2{font-size:21px;font-weight:500;line-height:1.5;color:var(--n-900);margin-bottom:22px;letter-spacing:.06em}
.sec-body{font-size:15px;line-height:1.85;color:var(--n-800)}

/* 雷达图 */
.radar-wrap{display:flex;justify-content:center;margin-top:4px}
.radar{width:100%;max-width:336px;height:auto;display:block;overflow:visible}
.radar-judge{
  font-size:15px;line-height:1.85;color:var(--n-800);text-align:center;
  max-width:390px;margin:26px auto 0;letter-spacing:.02em;
}
.radar-judge b{font-weight:500}

/* 前五 */
.talent{
  display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--paper-200);
}
.talent:first-of-type{border-top:0;padding-top:4px}
.talent:last-child{padding-bottom:0}
.talent-no{
  font-family:var(--font-num);font-size:11px;color:var(--ink-400);
  font-variant-numeric:tabular-nums;width:16px;flex:none;padding-top:6px;letter-spacing:.04em;
}
.talent-body{flex:1;min-width:0}
.talent-top{display:flex;align-items:baseline;gap:10px}
.talent-nm{font-size:17px;font-weight:500;color:var(--n-900);letter-spacing:.1em}
.talent-dom{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--n-600);letter-spacing:.1em;flex:none}
.talent-def{font-size:13px;color:var(--n-600);margin-top:7px;line-height:1.65}
.talent-val{
  font-size:13px;color:var(--ink-600);margin-top:11px;
  padding-left:11px;border-left:2px solid var(--ink-100);line-height:1.7;
}

/* 定位描述 */
.desc p{font-size:15px;line-height:1.9;color:var(--n-800);margin-bottom:22px;letter-spacing:.02em}
.desc p:last-child{margin-bottom:0;color:var(--clay-600)}

/* 行动建议 */
.advice{margin-top:34px;padding-left:18px;border-left:1px solid var(--paper-200)}
.advice:first-child{margin-top:0}
.advice h3{font-size:16px;font-weight:500;color:var(--n-900);letter-spacing:.08em}
.advice p{font-size:15px;line-height:1.82;color:var(--n-800);margin-top:12px}
.advice .why{color:var(--n-600)}
.advice .done{font-size:13px;color:var(--ink-600);line-height:1.65;letter-spacing:.02em}
.advice .done::before{content:"怎么算成 · ";letter-spacing:.06em;color:var(--ink-400)}

/* 耗电 */
.drain{
  position:relative;overflow:hidden;
  background:var(--clay-50);border-radius:var(--r-md);padding:20px 20px 20px 22px;margin-bottom:10px;
}
.drain::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--clay-400)}
.drain:last-child{margin-bottom:0}
.drain-top{display:flex;align-items:baseline;gap:12px}
.drain-nm{font-size:15px;font-weight:500;color:var(--n-900);letter-spacing:.1em}
.drain-tag{font-size:10px;color:var(--clay-600);letter-spacing:.1em;margin-left:auto;flex:none}
.drain-scene{font-size:13px;color:var(--n-800);line-height:1.72;margin-top:13px}
.drain-act{font-size:13px;color:var(--n-600);line-height:1.72;margin-top:9px}
.drain-act b{font-weight:500;color:var(--clay-800)}

/* 柔性入口 */
.soft{margin-top:76px;padding-top:44px;border-top:1px solid var(--paper-200);text-align:center}
.soft .brand-sm{margin:0 auto 24px;opacity:.85}
.soft .judge{font-size:15px;font-weight:500;color:var(--n-900);line-height:1.9;letter-spacing:.04em}
.soft p{font-size:14px;line-height:1.9;color:var(--n-600);margin-top:16px}
.soft .find{font-size:14px;line-height:1.9;color:var(--n-800);margin-top:22px}
.soft .qr{
  width:148px;height:148px;margin:32px auto 0;display:block;
}
.soft .qr img{width:100%;height:100%;display:block}
.soft .id{font-size:12px;color:var(--n-600);margin-top:16px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.soft .end{font-size:13px;color:var(--n-400);margin-top:26px;letter-spacing:.04em}

/* 底部操作 */
.foot-actions{display:flex;gap:10px;margin-top:52px}
.foot-actions .btn-ghost{flex:1;min-width:0}
.foot-actions .btn-ghost.primary{
  background:var(--ink-600);border-color:var(--ink-600);color:#fff;
}
.foot-actions .btn-ghost.primary:hover{background:var(--ink-800);border-color:var(--ink-800)}
.re-test{margin-top:26px;text-align:center}
.footer{margin-top:76px;text-align:center;font-size:10px;line-height:1.75;color:var(--n-400);letter-spacing:.02em}
.footer .mark{margin-bottom:14px}
.footer .ver{margin-top:14px;letter-spacing:.14em}

/* 弹层 */
.mask{
  position:fixed;inset:0;background:rgba(20,26,29,.44);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fadeIn 160ms ease-out both;
}
.modal{
  width:100%;max-width:360px;background:var(--paper-0);border-radius:var(--r-lg);
  padding:26px;border:1px solid var(--paper-200);
  animation:riseIn 220ms var(--ease) both;
}
.modal p{font-size:15px;line-height:1.8;color:var(--n-800)}
.modal .row{display:flex;gap:12px;margin-top:26px}
.modal .row button{flex:1}
.modal .cap{margin-top:10px}

/* 结果卡预览 */
.cardmodal{
  position:fixed;inset:0;background:rgba(16,21,24,.94);z-index:55;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;gap:14px;animation:fadeIn 180ms ease-out both;
}
.cardmodal .shot{
  max-width:100%;max-height:74vh;border-radius:var(--r-md);
  background:#fff;overflow:hidden;display:flex;justify-content:center;
}
.cardmodal .shot img{
  max-height:74vh;max-width:100%;width:auto;height:auto;
  object-fit:contain;display:block;
}
.cardmodal .bar{display:flex;gap:10px;align-items:center}
.cardmodal .bar .btn-ghost{
  background:rgba(255,255,255,.94);border-color:transparent;color:var(--ink-600);
}
.cardmodal .tip{font-size:11px;color:rgba(255,255,255,.78);letter-spacing:.04em;text-align:center}
.cardmodal .close{
  position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));right:14px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;line-height:1;
}
.cardmodal .spin{
  color:#fff;font-size:13px;letter-spacing:.1em;
}
.toast{
  position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--n-900);color:#fff;
  font-size:13px;padding:11px 22px;border-radius:var(--r-full);z-index:60;
  animation:fadeIn 160ms ease-out both;white-space:nowrap;letter-spacing:.04em;
}

/* 页眉：仅宽屏显示，给桌面端一个品牌锚点 */
.duel-head{display:none}

/* ---------- 桌面端 ---------- */
@media (min-width:769px){
  /* 桌面端：导航条移到顶部 */
  .tabbar{
    top:0;bottom:auto;max-width:800px;
    display:flex;align-items:center;justify-content:flex-end;gap:4px;
    height:60px;padding:0 24px;
    border-top:0;border-bottom:1px solid var(--paper-200);
    background:var(--paper-100);
  }
  .tabbar .tb-brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
  .tabbar .tb-brand img{width:30px;height:auto;flex:none;opacity:.9}
  .tabbar .tb-brand .tb-t{font-size:13px;white-space:nowrap}
  .tabbar .tb-brand .tb-d{font-size:11px;color:var(--n-400);letter-spacing:.06em;white-space:nowrap}
  .tabbar button{
    flex-direction:row;height:36px;padding:0 14px;gap:6px;
    font-size:12px;letter-spacing:.1em;
  }
  .tabbar button .ico{width:16px;height:16px}
  .tabbar button.on::before{display:none}

  .mine{padding-top:126px;padding-bottom:56px}

  .duel{max-width:800px}
  .duel-head{
    display:flex;align-items:center;gap:11px;flex:none;
    margin-bottom:14px;padding-bottom:16px;
    border-bottom:1px solid var(--paper-200);
  }
  .duel-head .brand-xs{width:34px;height:auto;opacity:.9;flex:none}
  .duel-head .dh-t{font-size:13px}
  .duel-head .dh-d{font-size:11px;color:var(--n-400);letter-spacing:.06em;margin-left:auto}
  .duel-body{justify-content:center}
  .cards{flex-direction:row;align-items:stretch;gap:0}
  .cards .card{flex:1;min-height:252px;padding:42px 34px 34px}
  .cards .or{padding:0 30px;width:auto}
  .cards .or span{width:40px;height:40px;font-size:12px}
  .cards .card-q{font-size:18px;line-height:1.85}
  .cards .card-n{font-size:13px;margin-top:22px}
  .cards .or::before{
    left:0;right:0;top:50%;bottom:auto;width:auto;height:0;
    border-left:0;border-top:1px dashed var(--paper-400);
  }
  .order-card{min-height:70px}
  .intro{padding-top:150px}
}
/* 宽屏（≥1200px）：内容不再挤在 720/540 里。
   桌面 1440 宽时，原来的 800px 容器只占 55%，正文显得又小又空。 */
@media (min-width:1200px){
  .tabbar{max-width:640px;padding:0 4px}
  .intro{max-width:640px;padding-top:150px}
  .intro h1{font-size:40px;line-height:1.45}
  .lead{font-size:17px;max-width:352px;margin-top:28px}
  .nb-chip{padding:26px 6px 22px}
  .nb-chip .lb{letter-spacing:.12em}

  .duel{max-width:1080px}
  .duel-head{padding-bottom:18px;margin-bottom:18px}
  .duel-body{padding:20px 0}
  .duel-hint{font-size:13px;margin-bottom:26px}
  .cards .card{min-height:432px;padding:64px 52px 50px}
  .cards .card-q{font-size:26px;line-height:1.76}
  .cards .card-n{font-size:16px;margin-top:34px}
  .cards .or{padding:0 40px}
  .cards .or span{width:44px;height:44px;font-size:13px}
  .progbar{height:10px;border-radius:5px;margin-top:20px}
  .count{font-size:12px;margin-top:14px}

  .rescue{max-width:680px}
  .rescue h2{font-size:26px}
  .rescue .sub{font-size:15px;margin-top:14px}
  .ritem{min-height:74px;padding:18px 20px}
  .order-card{min-height:88px}

   ========================================================= */
function el(id){ return document.getElementById(id); }
function talent(id){
  for (var i=0;i<TALENTS.length;i++){ if (TALENTS[i].id===id) return TALENTS[i]; }
  return null;
}
function talentByName(name){
  for (var i=0;i<TALENTS.length;i++){ if (TALENTS[i].name===name) return TALENTS[i]; }
  return null;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  for (var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pad2(n){ return n<10 ? '0'+n : ''+n; }

/* =========================================================
   3. 存储 STORE
   ========================================================= */
var KEY='kairos_v1';          /* 进行中的进度 */
var REC_KEY='kairos_rec_v1';  /* 历史测评记录 */
var PREF_KEY='kairos_pref_v1';/* 记忆开关 */
var REC_MAX=8;

var memoryFallback=null;
var storeOK=(function(){
  try{ localStorage.setItem('__k','1'); localStorage.removeItem('__k'); return true; }
  catch(e){ return false; }
})();

/* 记忆开关：关闭后不写盘，同时清空已存内容 */
var pref={remember:true, seenGuide:false};
var records=[];

function loadPref(){
  if (!storeOK) return;
  try{
    var raw=localStorage.getItem(PREF_KEY);
    if (!raw) return;
    var p=JSON.parse(raw);
    if (!p) return;
    if (typeof p.remember==='boolean') pref.remember=p.remember;
    if (typeof p.seenGuide==='boolean') pref.seenGuide=p.seenGuide;
  }catch(e){}
}
function savePref(){
  if (!storeOK) return;
  try{ localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }catch(e){}
}
function loadRecords(){
  if (!storeOK || !pref.remember) return;
  try{
    var raw=localStorage.getItem(REC_KEY);
    if (!raw) return;
    var arr=JSON.parse(raw);
    if (arr && arr.length && arr[0] && arr[0].result) records=arr.slice(0,REC_MAX);
  }catch(e){ records=[]; }
}
function saveRecords(){
  if (!storeOK || !pref.remember) return;
  try{ localStorage.setItem(REC_KEY, JSON.stringify(records.slice(0,REC_MAX))); }catch(e){}
}
function pushRecord(){
  if (!storeOK || !pref.remember || !state.result) return;
  var r=state.result;
  records.unshift({ts:Date.now(), result:r});
  if (records.length>REC_MAX) records=records.slice(0,REC_MAX);
  saveRecords();
}
function dropRecords(){
  records=[];
  if (storeOK){ try{ localStorage.removeItem(REC_KEY); }catch(e){} }
}
/* 退出记忆：关开关 + 抹掉这台设备上的一切 */
function forgetAll(){
  pref.remember=false; savePref();
  dropRecords(); clearStore();
}

function snapshot(){
  /* 从主页回到流程时，进度仍要按真实阶段落盘，否则刷新会丢 */
  var st=(state.stage==='intro'||state.stage==='mine')
    ? (state.pendingStage||'intro') : state.stage;
  return {
    v:1, ts:Date.now(),
    stage:st, round:state.round, queue:state.queue,
    pairs:state.pairs, pairIndex:state.pairIndex, flips:state.flips,
    bye:state.bye, winners:state.winners, losers:state.losers,
    rescued:state.rescued, history:state.history,
    eliminatedAt:state.eliminatedAt,
    orderPool:state.orderPool, order:state.order, result:state.result
  };
}
function save(){
  if (!pref.remember){ memoryFallback=null; return; }
  var raw;
  try{ raw=JSON.stringify(snapshot()); }catch(e){ return; }
  if (storeOK){
    try{ localStorage.setItem(KEY,raw); }catch(e){ memoryFallback=raw; }
  } else {
    memoryFallback=raw;
  }
}
function loadSnap(){
  if (!pref.remember) return null;
  var raw=null;
  if (storeOK){ try{ raw=localStorage.getItem(KEY); }catch(e){ raw=null; } }
  if (!raw) raw=memoryFallback;
  if (!raw) return null;
  var s;
  try{ s=JSON.parse(raw); }catch(e){ clearStore(); return null; }
  if (!s || s.v!==1){ clearStore(); return null; }
  if (Date.now()-s.ts > 30*864e5){ clearStore(); return null; }
  return s;
}
function clearStore(){
  memoryFallback=null;
  if (storeOK){ try{ localStorage.removeItem(KEY); }catch(e){} }
}

/* =========================================================
   4. 状态 STATE
   ========================================================= */
var state={
  stage:'intro',
  round:0,
  queue:[], pairs:[], pairIndex:0, flips:[], bye:null,
  winners:[], losers:[], rescued:[],
  history:[], eliminatedAt:{},
  orderPool:[], order:[],
  result:null,
  lock:false,
  resume:false,
  pendingStage:null,
  resumeLabel:'',
  undoStack:[],
  fromMine:false
};

function resetState(){
  state.stage='intro'; state.round=0;
  state.queue=[]; state.pairs=[]; state.pairIndex=0; state.flips=[]; state.bye=null;
  state.winners=[]; state.losers=[]; state.rescued=[];
  state.history=[]; state.eliminatedAt={};
  state.orderPool=[]; state.order=[]; state.result=null;
  state.lock=false; state.resume=false;
  state.pendingStage=null; state.resumeLabel='';
  state.undoStack=[]; state.fromMine=false;
}

/* =========================================================
   5. 引擎 ENGINE
   ========================================================= */
function buildRound(queue){
  var arr=shuffle(queue.slice());
  var n=arr.length, bye=null, rest=arr;
  if (n%2===1){ bye=arr[0]; rest=arr.slice(1); }
  var pairs=[];
  for (var i=0;i<rest.length;i+=2){ pairs.push([rest[i],rest[i+1]]); }
  return {pairs:pairs, bye:bye, queue:arr};
}

function startGame(){
  resetState();
  clearStore();
  state.round=1;
  var all=TALENTS.map(function(t){ return t.id; });
  var r=buildRound(all);
  state.queue=r.queue; state.pairs=r.pairs; state.bye=r.bye;
  state.pairIndex=0;
  state.flips=new Array(r.pairs.length);
  for (var i=0;i<state.flips.length;i++){ state.flips[i]=Math.random()<0.5; }
  state.stage='duel';
  save(); render();
}

/* 记住每选一次之前的现场，供「返回」撤销 */
var UNDO_KEYS=['round','queue','pairs','pairIndex','flips','bye',
  'winners','losers','rescued','history','eliminatedAt'];

function pushUndo(){
  var snap={};
  UNDO_KEYS.forEach(function(k){ snap[k]=state[k]; });
  state.undoStack.push(JSON.stringify(snap));
  if (state.undoStack.length>60) state.undoStack.shift();
}
function undoPair(){
  if (!state.undoStack.length) return false;
  var snap;
  try{ snap=JSON.parse(state.undoStack.pop()); }catch(e){ return false; }
  UNDO_KEYS.forEach(function(k){
    if (typeof snap[k]!=='undefined') state[k]=snap[k];
  });
  state.stage='duel'; state.lock=false;
  save(); render();
  return true;
}

function resolvePair(choice){
  var pair=state.pairs[state.pairIndex];
  if (!pair) return;
  pushUndo();
  var a=pair[0], b=pair[1];

  /* 第 3 轮是决定前五的最后一轮，界面不提供逃生口。
     若异常路径仍传回 none，按「选上面那张」处理，保证流程不卡死。 */
  if (state.round===3 && choice==='none') choice='a';

  if (choice==='a'){
    state.winners.push(a); state.losers.push(b); state.eliminatedAt[b]=state.round;
  } else if (choice==='b'){
    state.winners.push(b); state.losers.push(a); state.eliminatedAt[a]=state.round;
  } else {
    state.losers.push(a,b);
    state.eliminatedAt[a]=state.round; state.eliminatedAt[b]=state.round;
  }
  state.history.push({a:a,b:b,win:choice,round:state.round});
  state.pairIndex+=1;

  if (state.pairIndex>=state.pairs.length){
    endRound();
  } else {
    state.lock=false;
    save(); render();
  }
}

function endRound(){
  state.lock=false;
  if (state.bye) state.winners.push(state.bye);

  if (state.round===3){
    state.orderPool=shuffle(state.winners.slice());
    state.stage='order';
    save(); render();
    return;
  }
  state.stage='roundEnd';
  save(); render();
  setTimeout(function(){
    if (state.stage==='roundEnd'){ gotoRescue(); }
  },1200);
}

function gotoRescue(){
  state.stage='rescue';
  save(); render();
}

function doRescue(id){
  if (!id){ advanceRound(); return; }
  if (state.rescued.indexOf(id)>=0){ advanceRound(); return; }
  var i=state.losers.indexOf(id);
  if (i<0){ advanceRound(); return; }
  state.rescued.push(id);
  state.losers.splice(i,1);
  state.winners.push(id);
  advanceRound();
}

function advanceRound(){
  state.round+=1;
  state.queue=state.winners.slice();
  state.winners=[]; state.losers=[];
  var r=buildRound(state.queue);
  state.pairs=r.pairs; state.bye=r.bye; state.queue=r.queue;
  state.pairIndex=0;
  state.flips=new Array(r.pairs.length);
  for (var i=0;i<state.flips.length;i++){ state.flips[i]=Math.random()<0.5; }
  state.stage='duel';
  state.lock=false;
  save(); render();
}

function pickFirst(id){
  var i=state.orderPool.indexOf(id);
  if (i<0) return;
  state.order.push(id);
  state.orderPool.splice(i,1);
  if (state.orderPool.length===1){
    state.order.push(state.orderPool[0]);
    state.orderPool=[];
    finalize();
    return;
  }
  save(); render();
}

/* =========================================================
   6. 计分 SCORE
   ========================================================= */
var SCORE_BY_ROUND={1:25,2:45,3:65};
var SCORE_BY_RANK=[100,94,89,84,78];

function computeScores(){
  var s={};
  TALENTS.forEach(function(t){
    var rank=state.order.indexOf(t.id);
    if (rank>=0){
      s[t.id]=SCORE_BY_RANK[rank];
    } else {
      var round=state.eliminatedAt[t.id];
      var base=SCORE_BY_ROUND[round];
      if (typeof base!=='number') base=25;
      if (state.rescued.indexOf(t.id)>=0) base=Math.min(base+8,70);
      s[t.id]=base;
    }
  });
  var bucket={S:[],E:[],R:[],I:[]};
  TALENTS.forEach(function(t){ bucket[t.d].push(s[t.id]); });
  var dom={};
  ['S','E','R','I'].forEach(function(k){
    var arr=bucket[k];
    var sum=0;
    for (var i=0;i<arr.length;i++) sum+=arr[i];
    dom[k]=Math.round(sum/arr.length);
  });
  return {item:s, dom:dom};
}

function judgeArchetype(top5){
  var cnt={S:0,E:0,R:0,I:0};
  top5.forEach(function(id){ cnt[talent(id).d]+=1; });

  var keys=['S','E','R','I'];
  keys.sort(function(x,y){ return cnt[y]-cnt[x]; });
  var t1=keys[0], t2=keys[1];

  var firstDomain=talent(top5[0]).d;
  var main=t1, sub=t2;
  /* 并列时以 Top1 才干所属域为主域，但仅当它确实处在并列组内 */
  if (cnt[t1]===cnt[t2] && firstDomain!==t1 && cnt[firstDomain]===cnt[t1]){
    main=firstDomain;
    sub=t1;
  }

  if (cnt[main]>=3 && cnt[main]-cnt[sub]>=2){
    return {code:main, main:main, sub:null};
  }
  return {code:main+'·'+sub, main:main, sub:sub};
}

function pickDesc(arch, top5){
  var firstDomain=talent(top5[0]).d;
  var pos=(firstDomain===arch.main) ? 'main' : 'sub';
  var key=arch.code+'_'+pos;
  return DESC[key] || DESC[arch.code+'_main'] || DESC[arch.main];
}

function finalize(){
  state.order=state.order.slice(0,5);

  /* 兜底：前两轮若弃权较多，晋级人数可能不足 5。
     按单项分从高到低补足（同分随机），保证结果页永远是 5 项。 */
  if (state.order.length<5){
    var pre=computeScores();
    var pool=shuffle(TALENTS.map(function(t){ return t.id; })
      .filter(function(id){ return state.order.indexOf(id)<0; }));
    pool.sort(function(x,y){ return pre.item[y]-pre.item[x]; });
    while (state.order.length<5 && pool.length){
      state.order.push(pool.shift());
    }
  }

  var sc=computeScores();
  var arch=judgeArchetype(state.order);

  var lowest='S';
  ['S','E','R','I'].forEach(function(k){
    if (sc.dom[k]<sc.dom[lowest]) lowest=k;
  });

  var desc=pickDesc(arch, state.order);
  var drainList=TALENTS.filter(function(t){ return t.d===lowest; })
    .sort(function(x,y){ return sc.item[x.id]-sc.item[y.id]; })
    .slice(0,3)
    .map(function(t){
      var d=DRAIN[t.id] || {scene:'',action:'规避',actionText:''};
      return {name:t.name, scene:d.scene, action:d.action, actionText:d.actionText};
    });

  state.result={
    top5:state.order.slice(),
    item:sc.item,
    dom:sc.dom,
    arch:arch,
    lowest:lowest,
    desc:desc,
    advice:ADVICE[lowest].slice(0,3),
    drain:drainList
  };
  state.stage='result';
  state.fromMine=false;
  pushRecord();
  save(); render();
  window.scrollTo(0,0);
}

/* =========================================================
   7. 雷达图
   ========================================================= */
function radarSVG(scores, lowest){
  /* 画布给到 340：轴标签放在顶点外侧固定偏移，必须留出上下左右的字宽与数值行 */
  var size=340, cx=170, cy=170, R=Math.round(size*0.34);
  var AXES=[
    {k:'S',label:'洞察',deg:-90},
    {k:'E',label:'落地',deg:0},
    {k:'R',label:'连接',deg:90},
    {k:'I',label:'推动',deg:180}
  ];
  function rad(d){ return d*Math.PI/180; }
  function pt(deg,ratio){
    return [cx+R*ratio*Math.cos(rad(deg)), cy+R*ratio*Math.sin(rad(deg))];
  }
  function f(n){ return Math.round(n*100)/100; }

  var grid='';
  for (var i=1;i<=5;i++){
    var r=i/5;
    var pts=AXES.map(function(a){ var p=pt(a.deg,r); return f(p[0])+','+f(p[1]); }).join(' ');
    grid+='<polygon points="'+pts+'" fill="none" stroke="#DFE4DD" stroke-width="0.5"/>';
  }

  var spokes='';
  AXES.forEach(function(a){
    var p=pt(a.deg,1);
    spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+f(p[0])+'" y2="'+f(p[1])+'" stroke="#DFE4DD" stroke-width="0.5"/>';
  });

  var dps=AXES.map(function(a){
    var v=0.3+0.7*(scores[a.k]/100);
    if (v<0) v=0; if (v>1) v=1;
    return pt(a.deg,v);
  });
  var poly=dps.map(function(p){ return f(p[0])+','+f(p[1]); }).join(' ');

  var dots=dps.map(function(p){
    return '<circle cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="3" fill="#3A6175"/>';
  }).join('');

  var labels='';
  AXES.forEach(function(a){
    var end=pt(a.deg,1);
    var lx, ly, anchor, vy;
    if (a.deg===-90){          /* 洞察：上方 */
      lx=cx; ly=end[1]-26; anchor='middle'; vy=ly+17;
    } else if (a.deg===0){     /* 落地：右侧 */
      lx=end[0]+14; ly=end[1]+5; anchor='start'; vy=ly+16;
    } else if (a.deg===90){    /* 连接：下方 */
      lx=cx; ly=end[1]+26; anchor='middle'; vy=ly+16;
    } else {                   /* 推动：左侧 */
      lx=end[0]-14; ly=end[1]+5; anchor='end'; vy=ly+16;
    }

    labels+='<text x="'+f(lx)+'" y="'+f(ly)+'" text-anchor="'+anchor+'" font-size="13" fill="#697070">'+a.label+'</text>';
    labels+='<text x="'+f(lx)+'" y="'+f(vy)+'" text-anchor="'+anchor+'" font-size="12" fill="#2B3134" style="font-variant-numeric:tabular-nums">'+scores[a.k]+'</text>';

    if (a.k===lowest){
      if (a.deg===-90){
        labels+='<line x1="'+f(cx-11)+'" y1="'+f(vy+16)+'" x2="'+f(cx+11)+'" y2="'+f(vy+16)+'" stroke="#9E6D48" stroke-width="3" stroke-linecap="round"/>';
      } else if (a.deg===90){
        labels+='<line x1="'+f(cx-11)+'" y1="'+f(vy+16)+'" x2="'+f(cx+11)+'" y2="'+f(vy+16)+'" stroke="#9E6D48" stroke-width="3" stroke-linecap="round"/>';
      } else {
        labels+='<line x1="'+f(lx)+'" y1="'+f(vy+17)+'" x2="'+f(lx+14)+'" y2="'+f(vy+17)+'" stroke="#9E6D48" stroke-width="3" stroke-linecap="round"/>';
      }
    }
  });

  return '<svg class="radar" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="四大域得分雷达图">'
    + grid + spokes
    + '<polygon points="'+poly+'" fill="#3A6175" fill-opacity="0.14" stroke="#3A6175" stroke-width="1.5" stroke-linejoin="round"/>'
    + dots + labels
    + '</svg>';
}

function judgeGap(dom, lowest, highest){
  var gap=dom[highest]-dom[lowest];
  var hi='<b style="color:'+DOMAINS[highest].hex+'">'+DOMAINS[highest].name+'</b>';
  var lo='<b style="color:'+DOMAINS[lowest].hex+'">'+DOMAINS[lowest].name+'</b>';
  if (gap>=35){
    return '你是尖的。重心在'+hi+'，'+lo+'这件事你会明显比人吃力。';
  }
  if (gap>=15){
    return '你有明确重心，但四个域都还在可用区间。';
  }
  return '你是圆的。哪都能用，但单点突破的爆发力弱，需要靠组合取胜。';
}

}

function viewDuel(){
  var pair=state.pairs[state.pairIndex];
  if (!pair) return '';
  var flip=state.flips[state.pairIndex];
  var topId=flip?pair[1]:pair[0];
  var botId=flip?pair[0]:pair[1];
  var topSlot=flip?'b':'a';
  var botSlot=flip?'a':'b';

  var pct=Math.round(state.pairIndex/state.pairs.length*100);
  var total=state.pairs.length;
  var RND=['','第一轮','第二轮','第三轮'];
  function pad2(n){ return n<10 ? '0'+n : ''+n; }

  function card(id,slot){
    var t=talent(id);
    return '<button class="card" data-act="pick" data-id="'+slot+'" data-tid="'+id+'" data-dom="'+t.d+'">'
      +'<span class="card-q">'+esc(t.q)+'</span>'
      +'<span class="card-n">'+esc(t.name)+'</span>'
      +'</button>';
  }

  /* 最后一轮不提供「都不像我」：此时只剩 10 项，都是前两轮筛出来的真候选 */
  var skip = state.round<3
    ? '<div class="duel-skip"><button class="btn-text" data-act="pick" data-id="none">都不像我</button></div>'
    : '<div class="duel-skip"></div>';

  return '<div class="duel">'
    +'<div class="duel-head">'
      + brandMark('brand-xs')
      +'<span class="dh-t">'+brandWord()+'</span>'
      +'<span class="dh-d">34 项才干，两两对决</span>'
    +'</div>'
    +'<div class="progbar"><i style="width:'+pct+'%"></i></div>'
    +'<p class="count" aria-live="polite">'
      +'<button class="nav-back" data-act="back"><span class="ar">‹</span>返回</button>'
      +'<span class="rnd">'+(RND[state.round]||'')+'</span>'
      +'<span class="idx">'+pad2(state.pairIndex+1)+' / '+pad2(total)+'</span>'
    +'</p>'
    +'<div class="duel-body">'
    + (state.pairIndex===0 ? '<p class="duel-hint">选更像平时的你的那个</p>' : '')
    +'<div class="cards">'
    + card(topId,topSlot)
    +'<div class="or"><span>或</span></div>'
    + card(botId,botSlot)
    +'</div>'
    +'</div>'
    + skip
    +'</div>';
}

function viewRoundEnd(){
  var from=state.queue.length;
  var to=state.winners.length;
  return '<div class="trans" data-act="skipTrans">'
    +'<h2>第 '+state.round+' 轮完成</h2>'
    +'<p>'+from+' 项 → '+to+' 项</p>'
    +'</div>';
}

function viewRescue(){
  var pool=state.losers.filter(function(id){ return state.rescued.indexOf(id)<0; });
  var items=pool.map(function(id){
    var t=talent(id);
    return '<button class="ritem" data-act="rescueSel" data-id="'+id+'" role="radio" aria-checked="false">'
      +'<span class="ring"></span>'
      +'<span class="txt"><span class="nm">'+esc(t.name)+'</span>'
      +'<span class="df">'+esc(t.def)+'</span></span>'
      +'</button>';
  }).join('');

  return '<div class="rescue fade-in">'
    +'<button class="nav-back" data-act="back"><span class="ar">‹</span>返回</button>'
    +'<h2>这一轮淘汰了 '+state.losers.length+' 项</h2>'
    +'<p class="sub">有哪一项，你觉得冤枉了？</p>'
    +'<div class="rescue-list" role="radiogroup" aria-label="选择要捞回的才干">'+items+'</div>'
    +'<div class="rescue-actions">'
    +'<button class="btn-primary" data-act="doRescue" disabled id="rescueBtn">捞回</button>'
    +'<button class="btn-text" data-act="skipRescue">都不冤枉，继续</button>'
    +'</div>'
    +'</div>';
}

function viewOrder(){
  var left=state.orderPool.length;
  var cards=state.orderPool.map(function(id){
    var t=talent(id);
    return '<button class="order-card" data-act="orderPick" data-id="'+id+'">'
      +'<span class="dot" style="background:'+DOMAINS[t.d].hex+'"></span>'
      +'<span class="nm">'+esc(t.name)+'</span>'
      +'<span class="dv">'+DOMAINS[t.d].name+'</span>'
      +'</button>';
  }).join('');

  var step=state.order.length+1;
  var totalStep=state.order.length+state.orderPool.length-1;

  return '<div class="duel fade-in">'
    +'<div class="progbar"><i style="width:'+Math.round(state.order.length/totalStep*100)+'%"></i></div>'
    +'<p class="count">'
    +'<button class="nav-back" data-act="back"><span class="ar">‹</span>返回</button>'
    +'<span class="rnd">定序 '+step+' / '+totalStep+'</span></p>'
    +'<div class="duel-body">'
    +'<div class="order-head">'
    +'<h2>这 '+left+' 项里，如果只能保住一个</h2>'
    +'<p>你保哪个？</p>'
    +'</div>'
    +'<div class="order-list" style="margin-top:24px">'+cards+'</div>'
    +'</div>'
    +'</div>';
}

function fmtDate(ts){
  var d=new Date(ts);
  function p(n){ return n<10?'0'+n:''+n; }
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())
    +' '+p(d.getHours())+':'+p(d.getMinutes());
}

  var domScores=r.dom;
  var keys=['S','E','R','I'];
  var highest=keys[0];
  keys.forEach(function(k){ if (domScores[k]>domScores[highest]) highest=k; });

  var top5=r.top5.map(function(id,idx){
    var t=talent(id);
    return '<div class="talent">'
      +'<div class="talent-no">'+pad2(idx+1)+'</div>'
      +'<div class="talent-body">'
      +'<div class="talent-top">'
      +'<span class="talent-nm">'+esc(t.name)+'</span>'
      +'<span class="talent-dom"><i class="dot" style="background:'+DOMAINS[t.d].hex+'"></i>'+DOMAINS[t.d].name+'</span>'
      +'</div>'
      +'<p class="talent-def">'+esc(t.def)+'</p>'
      +'<p class="talent-val">'+esc(t.v)+'</p>'
      +'</div>'
      +'</div>';

  var lowName=DOMAINS[r.lowest].name;
  var descHTML=r.desc.map(function(p){
    return '<p>'+esc(p.replace(/\{low\}/g,lowName))+'</p>';
  }).join('');

  var adviceHTML=r.advice.map(function(a){
    return '<div class="advice">'
      +'<h3>'+esc(a.title)+'</h3>'
      +'<p>'+esc(a.do)+'</p>'

      +'<p class="done">'+esc(a.done)+'</p>'

    ? '<div class="share-banner">'
      +'<div class="txt">'
      +'<p class="t1">这是朋友的一份结果</p>'

      +'</div>'

      +'</div>'

      +'<button class="btn-ghost primary" data-act="shareStart">我也要测一次</button>'
      +'</div>'
    : '<div class="foot-actions">'
      +'<button class="btn-ghost primary" data-act="saveCard">存成图片</button>'
      +'<button class="btn-ghost" data-act="copy">复制文字</button>'
      +'</div>'
      +'<div class="re-test">'
      +'<button class="btn-text" data-act="copyLink">复制分享链接</button>'
      +'<button class="btn-text" data-act="askRetest">重新测一次</button>'
      +'</div>';

  return '<div class="result fade-in'+(state.shareView?' has-banner':'')+'">'

    + banner

    + (state.shareView ? ''
      : '<div class="res-nav"><button class="nav-back" data-act="back">'
        +'<span class="ar">‹</span>返回</button></div>')

    +'<div class="hero">'
    + brandMark()
    +'<h1 class="arch">'+esc(arch.name)+'</h1>'
    +'<p class="code">'+esc(r.arch.code)+'</p>'

    +'</section>'

    +'<section class="sec">'
    +'<span class="sec-no">02</span>'

    +'<p class="ver">v2.0 · MVP2</p>'
    +'</div>'

    +'</div>';

function render(){
  var app=el('app');
  var html='';
  switch(state.stage){
    case 'intro': html=viewIntro(); break;
    case 'mine': html=viewMine(); break;
    case 'duel': html=viewDuel(); break;
    case 'roundEnd': html=viewRoundEnd(); break;
    case 'rescue': html=viewRescue(); break;
    case 'order': html=viewOrder(); break;
    case 'result': html=viewResult(); break;
    default: html=viewIntro();
  }
  if (state.stage==='intro' || state.stage==='mine') html+=tabbar();
  app.innerHTML=html;
}

/* ---------- 导航：主页 / 我的 / 返回 ---------- */
function goHome(){
  var st=state.stage;
  if (st==='intro'){ window.scrollTo(0,0); return; }
  if (st==='result'){
    state.fromMine=false; state.pendingStage=null;
    state.stage='intro';
    save(); render(); window.scrollTo(0,0);
    return;
  }
  if (st==='duel'||st==='rescue'||st==='order'||st==='roundEnd'){
    state.pendingStage=(st==='roundEnd'?'rescue':st);
    if (state.pendingStage==='duel'){
      state.resumeLabel='上次做到第 '+state.round+' 轮，第 '+(state.pairIndex+1)+' 对';
    } else if (state.pendingStage==='order'){
      state.resumeLabel='上次做到定序第 '+(state.order.length+1)+' 步';
    } else {
      state.resumeLabel='上次做到第 '+state.round+' 轮的捞回';
    }
    state.resume=true;
    state.stage='intro';
    save(); render(); window.scrollTo(0,0);
    return;
  }
  state.stage='intro'; render(); window.scrollTo(0,0);
}

function goMine(){
  state.stage='mine';
  render(); window.scrollTo(0,0);
}

/* 返回 = 回首页（不撤销上一步）。流程中回首页会保留进度，首页出现「继续」入口 */
function goBack(){
  var st=state.stage;
  if (st==='result' && state.fromMine){
    state.fromMine=false;
    state.stage='mine';
    render(); window.scrollTo(0,0);
    return;
  }
  goHome();
}

function openRec(idx){
  var rec=records[idx];
  if (!rec || !rec.result){ toast('这条记录读不出来'); return; }
  state.result=rec.result;
  state.shareView=false;
  state.fromMine=true;
  state.stage='result';
  render(); window.scrollTo(0,0);
}

function onPick(slot,btn){
  if (state.lock) return;
  state.lock=true;

  var cards=document.querySelectorAll('.card');
  for (var i=0;i<cards.length;i++){
    cards[i].classList.add('dim');
    cards[i].removeAttribute('data-act');
  }
  if (slot==='none'){
    for (var j=0;j<cards.length;j++){ cards[j].classList.add('dim'); }
  } else if (btn){
    btn.classList.remove('dim');
    btn.classList.add('picked');
  }

  setTimeout(function(){
    state.lock=false;
    resolvePair(slot);
  },180);
}

function onRescueSel(id,node){
  var items=document.querySelectorAll('.ritem');
  for (var i=0;i<items.length;i++){
    items[i].classList.remove('on');
    items[i].setAttribute('aria-checked','false');
  }
  node.classList.add('on');
  node.setAttribute('aria-checked','true');
  pickedRescue=id;

  var btn=el('rescueBtn');
  if (btn){
    btn.disabled=false;
    btn.textContent='捞回「'+talent(id).name+'」';
  }
}

function copyText(){
  var r=state.result;
  if (!r) return;
  var arch=ARCHETYPES[r.arch.code];
  var names=r.top5.map(function(id){ return talent(id).name; }).join(' · ');
  var lowName=DOMAINS[r.lowest].name;
  var url=shareURL();
  var linkLine=(url && !/^file:/.test(url)) ? (url+'\n\n') : '';
  var txt='我的才干罗盘：'+arch.name+'（'+r.arch.code+'）\n'
    +'前五：'+names+'\n'
    +'最耗电：'+lowName+'\n\n'
    + linkLine
    +'—— 知时 Kairos · 才干罗盘';

  function done(ok){
    toast(ok?'已复制，可以直接粘贴发送':'复制失败，请长按选择文字');
  }

  var settled=false;
  function once(v){ if (settled) return; settled=true; done(v); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ once(true); }, function(){ fallback(); });
    setTimeout(function(){ if (!settled) fallback(); }, 900);
  } else {
    fallback();
  }

  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;
      ta.style.position='fixed';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      once(ok);
    }catch(e){ once(false); }
  }
}

  document.body.appendChild(d);

/* =========================================================
   11. 分享 SHARE —— 结果编码进链接
   格式：#r=<版本><5 位前五><34 位分数>  固定 40 字符
   分数只有 11 个可能值，用 base36 单字符即可无损还原
   ========================================================= */
var B36='0123456789abcdefghijklmnopqrstuvwxyz';
var SCORE_LEVELS=[25,33,45,53,65,70,78,84,89,94,100];

function talentIndex(id){
  for (var i=0;i<TALENTS.length;i++){ if (TALENTS[i].id===id) return i; }
  return -1;
}
function levelOf(v){
  var best=0, bd=1e9;
  for (var i=0;i<SCORE_LEVELS.length;i++){
    var d=Math.abs(SCORE_LEVELS[i]-v);
    if (d<bd){ bd=d; best=i; }
  }
  return best;
}

function encodeResult(r){
  if (!r || !r.top5 || r.top5.length!==5) return '';
  var out='2';
  for (var i=0;i<5;i++){
    var ti=talentIndex(r.top5[i]);
    if (ti<0) return '';
    out+=B36.charAt(ti);
  }
  for (var j=0;j<TALENTS.length;j++){
    out+=B36.charAt(levelOf(r.item[TALENTS[j].id]));
  }
  return out;
}

/* 由 top5 + 单项分还原完整结果，逻辑与 finalize() 保持一致 */
function buildResult(top5, item){
  var dom={};
  ['S','E','R','I'].forEach(function(k){
    var arr=TALENTS.filter(function(t){ return t.d===k; });
    var sum=0;
    for (var i=0;i<arr.length;i++) sum+=item[arr[i].id];
    dom[k]=Math.round(sum/arr.length);
  });

  var arch=judgeArchetype(top5);

  var lowest='S';
  ['S','E','R','I'].forEach(function(k){
    if (dom[k]<dom[lowest]) lowest=k;
  });

  var desc=pickDesc(arch, top5);
  var drainList=TALENTS.filter(function(t){ return t.d===lowest; })
    .sort(function(x,y){ return item[x.id]-item[y.id]; })
    .slice(0,3)
    .map(function(t){
      var d=DRAIN[t.id] || {scene:'',action:'规避',actionText:''};
      return {name:t.name, scene:d.scene, action:d.action, actionText:d.actionText};
    });

  return {
    top5:top5.slice(), item:item, dom:dom, arch:arch, lowest:lowest,
    desc:desc, advice:ADVICE[lowest].slice(0,3), drain:drainList
  };
}

function decodeResult(code){
  if (!code || code.charAt(0)!=='2' || code.length!==40) return null;

  var top5=[], seen={}, i, k;
  for (i=1;i<=5;i++){
    k=B36.indexOf(code.charAt(i));
    if (k<0 || k>=TALENTS.length) return null;
    if (seen[TALENTS[k].id]) return null;
    seen[TALENTS[k].id]=1;
    top5.push(TALENTS[k].id);
  }

  var item={};
  for (i=0;i<TALENTS.length;i++){
    var lv=B36.indexOf(code.charAt(6+i));
    if (lv<0 || lv>=SCORE_LEVELS.length) return null;
    item[TALENTS[i].id]=SCORE_LEVELS[lv];
  }

  return buildResult(top5, item);
}

function readShareCode(){
  var h=window.location.hash || '';
  var m=/(?:#|&)r=([0-9a-z]{40})/.exec(h);
  if (!m) return null;
  return decodeResult(m[1]);
}

function shareURL(){
  var r=state.result;
  if (!r) return '';
  var code=encodeResult(r);
  if (!code) return '';
  return window.location.href.split('#')[0]+'#r='+code;
}

function copyLink(){
  var url=shareURL();

  if (/^file:/.test(url)){

    return;
  }

function writeClipboard(text, okMsg, failMsg){
  function ok(v){ toast(v?okMsg:failMsg); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ ok(true); }, function(){ legacy(); });
  } else { legacy(); }
  function legacy(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      var r=document.execCommand('copy');
      document.body.removeChild(ta);
      ok(r);
    }catch(e){ ok(false); }
  }
}

/* =========================================================
   12. 结果卡 CANVAS
   ========================================================= */
var C={
  paper:'#F3F4F1', line:'#E4E6E1',
  ink100:'#DCE9EF', ink200:'#B9D1DC', ink300:'#8FB0BF', ink400:'#5F8C9F',
  ink500:'#7698A6', ink600:'#3A6175', ink800:'#254555',
  clay:'#9E6D48', clay400:'#C09272',
  n400:'#A3A8A4', n600:'#697070', n800:'#2B3134', n900:'#141A1D'
};
var CFONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif';

function loadImg(src, cb){
  var im=new Image();
  im.onload=function(){ cb(im); };
  im.onerror=function(){ cb(null); };
  im.src=src;
}

function cvText(g, txt, x, y, opt){
  opt=opt||{};
  g.font=(opt.weight||'400')+' '+(opt.size||20)+'px '+CFONT;
  g.fillStyle=opt.color||C.n800;
  g.textAlign=opt.align||'left';
  g.textBaseline=opt.baseline||'alphabetic';
  if (opt.ls){
    /* 手动字距：逐字绘制 */
    var chars=String(txt).split('');
    var widths=[], total=0, i;
    for (i=0;i<chars.length;i++){
      widths.push(g.measureText(chars[i]).width);
      total+=widths[i];
    }
    total+=opt.ls*(chars.length-1);
    var cx=x;
    if (g.textAlign==='center') cx=x-total/2;
    else if (g.textAlign==='right') cx=x-total;
    g.textAlign='left';
    for (i=0;i<chars.length;i++){
      g.fillText(chars[i], cx, y);
      cx+=widths[i]+opt.ls;
    }
    return total;
  }
  g.fillText(String(txt), x, y);
  return g.measureText(String(txt)).width;
}

function wrapLines(g, txt, maxW, font){
  g.font=font;
  var lines=[], cur='';
  for (var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if (g.measureText(cur+ch).width>maxW && cur){
      lines.push(cur); cur=ch;
    } else { cur+=ch; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawRadarCv(g, cx, cy, R, dom, lowest){
  var AXES=[{k:'S',label:'洞察',deg:-90},{k:'E',label:'落地',deg:0},
            {k:'R',label:'连接',deg:90},{k:'I',label:'推动',deg:180}];
  function rad(d){ return d*Math.PI/180; }
  function pt(deg,r){ return [cx+R*r*Math.cos(rad(deg)), cy+R*r*Math.sin(rad(deg))]; }
  var i;

  g.lineWidth=1.4;
  g.strokeStyle='#DFE4DD';
  for (i=1;i<=4;i++){
    g.beginPath();
    AXES.forEach(function(a,idx){
      var p=pt(a.deg, i/4);
      if (idx===0) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]);
    });
    g.closePath();
    g.stroke();
  }

  AXES.forEach(function(a){
    var p=pt(a.deg,1);
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(p[0],p[1]); g.stroke();
  });

  var pts=AXES.map(function(a){
    var v=0.3+0.7*(dom[a.k]/100);
    if (v<0) v=0; if (v>1) v=1;
    return pt(a.deg,v);
  });
  g.beginPath();
  pts.forEach(function(p,idx){ if (idx===0) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]); });
  g.closePath();
  g.fillStyle='rgba(118,152,166,.16)';
  g.fill();
  g.lineWidth=2.6;
  g.strokeStyle=C.ink600;
  g.lineJoin='round';
  g.stroke();

  pts.forEach(function(p){
    g.beginPath(); g.arc(p[0],p[1],5,0,Math.PI*2);
    g.fillStyle=C.ink600; g.fill();
  });

  AXES.forEach(function(a){
    var p=pt(a.deg,1);
    var isLow=(a.k===lowest);
    var lx, ly, align, dy;
    if (a.deg===-90){ lx=cx; ly=p[1]-40; align='center'; dy=0; }
    else if (a.deg===0){ lx=p[0]+18; ly=p[1]+8; align='left'; dy=0; }
    else if (a.deg===90){ lx=cx; ly=p[1]+44; align='center'; dy=0; }
    else { lx=p[0]-18; ly=p[1]+8; align='right'; dy=0; }

    cvText(g, a.label, lx, ly, {size:24, color:isLow?C.clay:C.n600, align:align, ls:2});
    cvText(g, String(dom[a.k]), lx, ly+34, {size:22, color:isLow?C.clay:C.n900, align:align, weight:'500'});
  });
}

function renderCard(cb){
  var r=state.result;
  if (!r) { cb(null); return; }

  var W=1080, H=1920;
  var cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  var g=cv.getContext('2d');
  g.fillStyle=C.paper;
  g.fillRect(0,0,W,H);

  var assets={}, pending=2, ready=false;
  function done(){ pending--; if (pending<=0 && !ready){ ready=true; draw(); } }
  loadImg(MARK_SRC, function(im){ assets.mark=im; done(); });
  loadImg(QR_ROUND_SRC, function(im){ assets.qr=im; done(); });

  function draw(){
    var arch=ARCHETYPES[r.arch.code];
    var M=88;

    /* 品牌 */
    if (assets.mark){
      var mh=86, mw=Math.round(mh*assets.mark.width/assets.mark.height);
      g.drawImage(assets.mark, Math.round((W-mw)/2), 90, mw, mh);
    }
    cvText(g, 'KAIROS', W/2, 238, {size:18, color:C.ink400, align:'center', ls:10});

    /* 原型 */
    cvText(g, arch.name, W/2, 350, {size:76, weight:'500', color:C.n900, align:'center', ls:12});
    cvText(g, r.arch.code, W/2, 406, {size:22, weight:'500', color:C.clay, align:'center', ls:8});

    g.strokeStyle=C.line; g.lineWidth=1;
    g.beginPath(); g.moveTo(W/2-40, 452); g.lineTo(W/2+40, 452); g.stroke();

    /* 雷达 */
    drawRadarCv(g, W/2, 780, 205, r.dom, r.lowest);

    /* 判定句 */
    var keys=['S','E','R','I'], highest=keys[0];
    keys.forEach(function(k){ if (r.dom[k]>r.dom[highest]) highest=k; });
    var judge=judgeGap(r.dom, r.lowest, highest).replace(/<[^>]+>/g,'');
    var lines=wrapLines(g, judge, 760, '400 24px '+CFONT);
    var jy=1160;
    lines.slice(0,3).forEach(function(ln){
      cvText(g, ln, W/2, jy, {size:24, color:C.n600, align:'center'});
      jy+=40;
    });

    g.strokeStyle=C.line;
    g.beginPath(); g.moveTo(M, 1280); g.lineTo(W-M, 1280); g.stroke();

    /* 前五项：一行串联 */
    cvText(g, '\u524d\u4e94\u9879\u624d\u5e72', W/2, 1336, {size:16, color:C.n600, align:'center', ls:4});
    g.font='500 34px '+CFONT;
    var sep=30;
    var widths=r.top5.map(function(id){ return g.measureText(talent(id).name).width; });
    var totalW=0, i;
    for (i=0;i<widths.length;i++) totalW+=widths[i];
    totalW+=sep*(widths.length-1);
    var sx=(W-totalW)/2;
    r.top5.forEach(function(id,idx){
      cvText(g, talent(id).name, sx, 1400, {size:34, weight:'500', color:C.n900});
      sx+=widths[idx];
      if (idx<widths.length-1){
        cvText(g, '\u00b7', sx+sep/2, 1398, {size:24, color:C.ink300, align:'center'});
      }
      sx+=sep;
    });

    g.strokeStyle=C.line;
    g.beginPath(); g.moveTo(M, 1464); g.lineTo(W-M, 1464); g.stroke();

    /* 圆形抖音码 */
    var qs=320;
    if (assets.qr){
      g.drawImage(assets.qr, Math.round((W-qs)/2), 1468, qs, qs);
    }
    cvText(g, '\u6296\u97f3\u626b\u7801\uff0c\u6216\u76f4\u63a5\u641c @'+DOUYIN_NAME,
           W/2, 1846, {size:20, color:C.n600, align:'center'});
    cvText(g, '\u77e5\u65f6 Kairos \u00b7 \u975e Gallup \u5b98\u65b9\u4ea7\u54c1 \u00b7 \u4ec5\u4f9b\u81ea\u6211\u8ba4\u8bc6',
           W/2, 1888, {size:13, color:C.n400, align:'center', ls:1});

    cb(cv);
  }
}

function openGuide(force){

  if (state.stage!=='intro'){
    state.stage='intro';
    render(); window.scrollTo(0,0);
  }

  spot.steps=spotSteps();
  spot.i=0; spot.on=true;
  document.body.classList.add('spot-open');

  var d=document.createElement('div');
  d.className='spot'; d.id='spot';
  d.innerHTML='<div class="spot-hole" id="spotHole"></div>'
    +'<div class="spot-tip" id="spotTip"></div>';
  document.body.appendChild(d);

  setTimeout(paintSpot, 50);
}

function paintSpot(){
  if (!spot.on) return;
  var st=spot.steps[spot.i];
  var el=document.querySelector(st.sel);
  /* 当前页面没有这个目标（比如有续做卡片时的三块数字）就跳下一步 */
  if (!el){
    if (spot.i<spot.steps.length-1){ spot.i++; paintSpot(); }
    else closeGuide();
    return;
  }

  var r=el.getBoundingClientRect();
  /* 目标被挤出视口时先滚进来，再量一次 */
  if (r.top<6 || r.bottom>innerHeight-6){
    el.scrollIntoView({block:'center'});
    r=el.getBoundingClientRect();
  }

  var pad=9;
  var hole=document.getElementById('spotHole');
  var top=Math.max(r.top-pad,10);
  var left=Math.max(r.left-pad,0);
  var w=Math.min(r.width+pad*2, innerWidth-left);
  var h=Math.min(r.height+pad*2, innerHeight-top);

  hole.style.left=left+'px';
  hole.style.top=top+'px';
  hole.style.width=w+'px';
  hole.style.height=h+'px';

  var last=(spot.i===spot.steps.length-1);
  var tip=document.getElementById('spotTip');
  tip.className='spot-tip';
  tip.innerHTML='<p class="sno">'+pad2(spot.i+1)+' / '+pad2(spot.steps.length)+'</p>'
    +'<h3>'+esc(st.title)+'</h3>'
    +'<p>'+esc(st.text)+'</p>'
    +'<div class="sacts">'
    +'<button class="skip" data-spot="skip">跳过</button>'
    +'<div class="spot-dots">'+spot.steps.map(function(_,k){
        return '<i class="'+(k===spot.i?'on':'')+'"></i>';
      }).join('')+'</div>'
    +'<button class="next" data-spot="next">'+(last?'知道了':'下一步')+'</button>'
    +'</div>';

  var tipH=tip.offsetHeight || 190;
  var below=top+h+16;
  var above=top-16-tipH;
  var ty;
  if (below+tipH<=innerHeight-14) ty=below;
  else if (above>=14) ty=above;
  else ty=Math.max(14, innerHeight-tipH-16);
  tip.style.top=ty+'px';

  tip.classList.add('in');
}

function nextSpot(){
  if (!spot.on) return;
  if (spot.i>=spot.steps.length-1){ closeGuide(); return; }
  spot.i++;
  paintSpot();
}

function closeGuide(){
  if (!spot.on) return;
  spot.on=false;
  document.body.classList.remove('spot-open');
  var d=document.getElementById('spot');
  if (d && d.parentNode) d.parentNode.removeChild(d);
  pref.seenGuide=true; savePref();
}

document.addEventListener('click',function(e){
  if (!spot.on) return;
  var btn=e.target.closest ? e.target.closest('[data-spot]') : null;
  if (btn){
    if (btn.getAttribute('data-spot')==='skip') closeGuide();
    else nextSpot();
    return;
  }
  if (e.target.closest && e.target.closest('#spot')) nextSpot();
});

/* 首次进入主页时自动播一次；已看过或有续做进度就不打扰 */
setTimeout(function(){
  if (!pref.seenGuide && state.stage==='intro' && !state.resume) openGuide(false);
}, 620);

/* =========================================================
   10. 启动 BOOT
   ========================================================= */
(function boot(){
  /* 分享链接：直接还原结果，不走测试流程 */
  var shared=readShareCode();
  if (shared){
    state.shareView=true;
    state.stage='result';
    state.result=shared;
    render();
    window.scrollTo(0,0);
    return;
  }

  /* 数据自检 */
  if (TALENTS.length!==34){
    if (window.console) console.warn('才干数量异常：'+TALENTS.length);
  }
  var cnt={S:0,E:0,R:0,I:0};
  TALENTS.forEach(function(t){ cnt[t.d]+=1; });

  loadPref();
  loadRecords();

  var snap=loadSnap();
  if (snap && snap.stage && snap.stage!=='intro'){
    /* 恢复 */
    state.stage=snap.stage;
    state.round=snap.round||0;
    state.queue=snap.queue||[];
    state.pairs=snap.pairs||[];
    state.pairIndex=snap.pairIndex||0;
    state.flips=snap.flips||[];
    state.bye=snap.bye||null;
    state.winners=snap.winners||[];
    state.losers=snap.losers||[];
    state.rescued=snap.rescued||[];
    state.history=snap.history||[];
    state.eliminatedAt=snap.eliminatedAt||{};
    state.orderPool=snap.orderPool||[];
    state.order=snap.order||[];
    state.result=snap.result||null;

    if (state.flips.length!==state.pairs.length){
      state.flips=new Array(state.pairs.length);
      for (var i=0;i<state.flips.length;i++) state.flips[i]=Math.random()<0.5;
    }

    if (state.stage==='result' && state.result){
      render(); window.scrollTo(0,0);
      return;
    }

    var pend=state.stage;
    if (pend==='roundEnd') pend='rescue';
    if (pend!=='duel' && pend!=='order' && pend!=='rescue') pend='intro';

    if (pend!=='intro'){
      state.pendingStage=pend;
      if (pend==='duel'){
        state.resumeLabel='上次做到第 '+state.round+' 轮，第 '+(state.pairIndex+1)+' 对';
      } else if (pend==='order'){
        state.resumeLabel='上次做到定序第 '+(state.order.length+1)+' 步';
      } else {
        state.resumeLabel='上次做到第 '+state.round+' 轮的捞回';
      }
      state.resume=true;
      state.stage='intro';
      render();
      return;
    }

    resetState();
    render();
    return;
  }

  resetState();
  render();
})();

})();
</script>
